<!-- Página CRUD de Alunos -->

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Alunos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Gestão de Alunos</h1>

    <section class="cartao">
      <h2 id="form-titulo">Adicionar aluno</h2>
      <form id="aluno-form">
        <input type="hidden" id="aluno-id">

        <label>Nome
          <input type="text" id="nome" required>
        </label>
        <label>Apelido
          <input type="text" id="apelido" required>
        </label>
        <label>Curso
          <select id="curso" required></select>
        </label>
        <label>Ano curricular
          <input type="number" id="ano" min="1" max="5" required>
        </label>
        <label>Idade
          <input type="number" id="idade" min="15" max="99" required>
        </label>

        <div class="botoes">
          <button type="submit" id="btn-guardar">Adicionar</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
        </div>
      </form>
      <p id="mensagem" role="status"></p>
    </section>

    <section class="cartao">
      <h2>Lista de alunos</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Apelido</th>
              <th>Curso</th>
              <th>Ano</th>
              <th>Idade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-alunos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
